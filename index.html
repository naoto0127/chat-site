<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふわっとチャット</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif; }
  body { background:#f2f2f7; min-height:100vh; display:flex; justify-content:center; align-items:center; }
  .app { width:100%; max-width:520px; height:92vh; background:#fff; border-radius:20px; overflow:hidden;
         display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.15); }
  .screen { flex:1; display:none; flex-direction:column; }
  .screen.active { display:flex; }
  /* 参加画面 */
  #joinScreen { justify-content:center; align-items:center; gap:12px; padding:30px; position:relative; overflow-y:auto; }
  #joinScreen h1 { font-size:26px; } #joinScreen p { color:#8e8e93; font-size:13px; text-align:center; line-height:1.7; }
  #joinScreen > input, #joinScreen > button.join-btn { width:100%; }
  #joinScreen input:not([type=text]) {}
  .name-input { width:100%; padding:14px 16px; border:1px solid #d1d1d6; border-radius:14px; font-size:16px; outline:none; }
  .name-input:focus { border-color:#0b93f6; }
  .join-btn { padding:14px; border:none; background:#0b93f6; color:#fff; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; }
  .join-btn:hover { background:#0a84e8; }
  /* 左上のログイン */
  #authBox { position:absolute; top:12px; left:12px; font-size:12px; color:#8e8e93; }
  #authBox button { padding:6px 12px; font-size:12px; border-radius:12px; border:1px solid #d1d1d6; background:#fff; cursor:pointer; margin-left:6px; }
  /* フレンドパネル */
  #friendPanel { width:100%; background:#f7f7f9; border:1px solid #e5e5ea; border-radius:14px; padding:12px; text-align:left; font-size:13px; max-height:38vh; overflow-y:auto; }
  #friendPanel h3 { font-size:12px; margin:8px 0 4px; color:#8e8e93; font-weight:600; }
  #friendPanel h3:first-child { margin-top:0; }
  .friend-item { display:flex; align-items:center; gap:8px; padding:5px 2px; }
  .friend-item .fname { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini-btn { padding:4px 10px; font-size:12px; border:none; border-radius:10px; background:#0b93f6; color:#fff; cursor:pointer; flex-shrink:0; }
  .mini-btn.green { background:#30d158; }
  .mini-btn.gray { background:#c7c7cc; }
  #searchRow { display:flex; gap:6px; margin-top:4px; }
  #searchRow input { flex:1; padding:8px 10px; border:1px solid #d1d1d6; border-radius:10px; font-size:13px; outline:none; }
  .empty { color:#8e8e93; font-size:12px; padding:2px; }
  /* チャット画面 */
  .chat-header { padding:14px 16px; border-bottom:1px solid #e5e5ea; display:flex; align-items:center; gap:10px; }
  .room-name { font-weight:700; font-size:16px; flex:1; }
  .conn { font-size:11px; color:#30d158; }
  #messages { flex:1; overflow-y:auto; padding:16px; background:#f7f7f9; display:flex; flex-direction:column; gap:6px; }
  .msg-row { display:flex; align-items:flex-end; gap:6px; }
  .msg-row.me { justify-content:flex-end; }
  .bubble { max-width:70%; padding:10px 14px; border-radius:18px; font-size:15px; line-height:1.45;
            word-break:break-word; white-space:pre-wrap; }
  .msg-row.them .bubble { background:#e9e9eb; border-bottom-left-radius:4px; }
  .msg-row.me .bubble { background:#0b93f6; color:#fff; border-bottom-right-radius:4px; }
  .sender { font-size:11px; color:#8e8e93; margin:0 4px 2px; }
  .msg-time { font-size:10px; color:#8e8e93; }
  .input-area { display:flex; gap:10px; padding:12px; border-top:1px solid #e5e5ea; }
  .input-area input { flex:1; padding:12px 16px; border:1px solid #d1d1d6; border-radius:20px; font-size:15px; outline:none; }
  .input-area button { border:none; background:#0b93f6; color:#fff; border-radius:20px; padding:0 20px; font-weight:600; cursor:pointer; }
  @media (max-width:560px){ .app { border-radius:0; height:100vh; max-width:100%; } }
</style>
</head>
<body>
<div class="app">
  <!-- 参加画面 -->
  <div class="screen active" id="joinScreen">
    <div id="authBox"><button onclick="login()">🔑 Googleでログイン</button></div>
    <h1>💬 ふわっとチャット</h1>
    <p>おなじ<b>ルーム名(合言葉)</b>を入れれば、<br>どの端末でも同じトークに参加できます<br><span style="font-size:11px">※ログインするとフレンド機能が使えます (v5)</span></p>
    <div id="friendPanel" style="display:none">
      <h3>フレンド</h3><div id="fList"><div class="empty">まだフレンドがいません</div></div>
      <h3>届いた申請</h3><div id="rList"></div>
      <h3>グループ</h3><div id="groupList"><div class="empty">まだグループがありません</div></div>
      <button class="mini-btn" style="margin-top:4px" onclick="toggleGroupForm()">＋ グループを作る</button>
      <div id="groupForm" style="display:none; margin-top:6px;">
        <input id="groupName" placeholder="グループ名(例: 部活の仲間)" maxlength="20" style="width:100%; padding:8px 10px; border:1px solid #d1d1d6; border-radius:10px; font-size:13px; outline:none;">
        <div id="groupFriendPick" style="margin:6px 0;"></div>
        <button class="mini-btn green" onclick="createGroup()">作成</button>
      </div>
      <div id="inviteBox" style="margin-top:6px;"></div>
      <h3>友だちを名前で探す</h3>
      <div id="searchRow"><input id="searchName" placeholder="アカウント名(例: naoto)" onkeydown="if(event.key==='Enter')searchUsers()"><button class="mini-btn" onclick="searchUsers()">検索</button></div>
      <div id="searchResult"></div>
    </div>
    <input class="name-input" id="userName" placeholder="あなたの名前(例: さくら)" maxlength="12">
    <input class="name-input" id="roomCode" placeholder="ルーム名(例: きのうのパーティー)" maxlength="30">
    <button class="join-btn" onclick="join()">チャットに参加 →</button>
  </div>
  <!-- チャット画面 -->
  <div class="screen" id="chatScreen">
    <div class="chat-header">
      <span class="room-name" id="roomLabel"></span>
      <span class="conn" id="connLabel">接続中…</span>
    </div>
    <div id="messages"></div>
    <div class="input-area">
      <input id="msgInput" placeholder="メッセージを入力…" onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">送信</button>
    </div>
  </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyDCkJxFOV1xPASeRkMUKSlRUbVR0EMdtg4",
  authDomain: "team-49-739c8.firebaseapp.com",
  databaseURL: "https://team-49-739c8-default-rtdb.firebaseio.com",
  projectId: "team-49-739c8",
  storageBucket: "team-49-739c8.firebasestorage.app",
  messagingSenderId: "623257125970",
  appId: "1:623257125970:web:47d860d671493e18744b8b"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, set, get, onDisconnect, serverTimestamp, remove, query, orderByChild, equalTo }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let userName = "", roomId = "", lastKey = "", currentUid = null;
let myFriends = {}, myGroups = {}, currentInviteGid = null;
const COLORS = ['#ff9500','#30d158','#af52de','#ff2d55','#5ac8fa','#ffcc00','#007aff'];
const colorOf = name => COLORS[[...name].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escJs = s => s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const fmt = t => { const d = new Date(t); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); };

/* ===== ログイン / ゲスト ===== */
const ERR_MSG = { 'auth/unauthorized-domain': 'このサイトのドメインが未許可です(Firebaseの「承認済みドメイン」に naoto0127.github.io を追加してね)',
  'auth/operation-not-allowed': 'Googleログインが無効です(Firebaseの「ログイン方法」でGoogleを有効にしてね)',
  'auth/popup-blocked': 'ポップアップがブロックされました(ブラウザのアドレスバー横のポップアップブロックアイコンから許可してね)' };
const showLoginError = e => {
  document.getElementById('authBox').innerHTML = '⚠ ' + (ERR_MSG[e.code] || e.code || e.message) +
    ' <button onclick="login()">🔑 再ログイン</button>';
};
window.login = () => { signInWithPopup(auth, provider).catch(showLoginError); };
window.logout = () => { signOut(auth); };
getRedirectResult(auth).catch(showLoginError);

onAuthStateChanged(auth, async user => {
  const box = document.getElementById('authBox');
  if (user) {
    currentUid = user.uid;
    try {
      await set(ref(db,'users/'+user.uid), {
        name: user.displayName || 'ななし',
        lowerName: (user.displayName || '').toLowerCase()
      });
    } catch(e){}
    box.innerHTML = '👤 ' + esc(user.displayName||'') + ' <button onclick="logout()">ログアウト</button>';
    document.getElementById('friendPanel').style.display = 'block';
    document.getElementById('userName').value = user.displayName || '';
    onValue(ref(db,'friends/'+user.uid), s => renderFriends(s.val()));
    onValue(ref(db,'friendReqs/'+user.uid), s => renderReqs(s.val()));
    onValue(ref(db,'userGroups/'+user.uid), s => renderGroups(s.val()));
  } else {
    currentUid = null;
    box.innerHTML = '<button onclick="login()">🔑 Googleでログイン</button>';
    document.getElementById('friendPanel').style.display = 'none';
  }
});

/* ===== フレンド機能 ===== */
function renderFriends(val){
  myFriends = val || {};
  const el = document.getElementById('fList');
  if (!val) { el.innerHTML = '<div class="empty">まだフレンドがいません</div>'; return; }
  el.innerHTML = Object.entries(val).map(([uid,f]) =>
    `<div class="friend-item"><span class="fname">😊 ${esc(f.name)}</span>` +
    `<button class="mini-btn" onclick="talkFriend('${escJs(f.room)}','${escJs(f.name)}')">トーク</button></div>`
  ).join('');
}
function renderReqs(val){
  const el = document.getElementById('rList');
  if (!val) { el.innerHTML = ''; return; }
  el.innerHTML = Object.entries(val).map(([uid,r]) =>
    `<div class="friend-item"><span class="fname">${esc(r.name)} から申請</span>` +
    `<button class="mini-btn green" onclick="acceptReq('${uid}','${escJs(r.name)}')">承認</button>` +
    `<button class="mini-btn gray" onclick="declineReq('${uid}')">却下</button></div>`
  ).join('');
}
window.searchUsers = async function(){
  const q = document.getElementById('searchName').value.trim().toLowerCase();
  const box = document.getElementById('searchResult');
  if (!q) { box.innerHTML=''; return; }
  const s = await get(query(ref(db,'users'), orderByChild('lowerName'), equalTo(q)));
  const val = s.val();
  const items = val ? Object.entries(val).filter(([uid]) => uid !== currentUid) : [];
  box.innerHTML = items.length ? items.map(([uid,u]) =>
    `<div class="friend-item"><span class="fname">${esc(u.name)}</span>` +
    `<button class="mini-btn" onclick="sendReq('${uid}','${escJs(u.name)}')">申請</button></div>`
  ).join('') : '<div class="empty">見つかりませんでした</div>';
};
window.sendReq = async function(uid, name){
  await set(ref(db,'friendReqs/'+uid+'/'+currentUid), { name: auth.currentUser.displayName, ts: serverTimestamp() });
  alert(name + ' さんにフレンド申請を送りました!');
};
window.acceptReq = async function(fromUid, name){
  const room = 'f_' + [currentUid, fromUid].sort().join('_');
  const myName = auth.currentUser.displayName || 'ななし';
  await set(ref(db,'friends/'+currentUid+'/'+fromUid), { name, room });
  await set(ref(db,'friends/'+fromUid+'/'+currentUid), { name: myName, room });
  await remove(ref(db,'friendReqs/'+currentUid+'/'+fromUid));
};
window.declineReq = async function(fromUid){
  await remove(ref(db,'friendReqs/'+currentUid+'/'+fromUid));
};
window.talkFriend = function(room, fname){
  document.getElementById('roomCode').value = room;
  document.getElementById('userName').value = auth.currentUser.displayName || '';
  join();
};

/* ===== グループ機能 ===== */
function renderGroups(val){
  myGroups = val || {};
  const el = document.getElementById('groupList');
  const ids = Object.keys(myGroups);
  if (!ids.length) { el.innerHTML = '<div class="empty">まだグループがありません</div>'; return; }
  el.innerHTML = ids.map(gid => { const g = myGroups[gid];
    const canDelete = !g.owner || g.owner === currentUid;
    const subBtn = canDelete
      ? `<button class="mini-btn gray" onclick="deleteGroup('${gid}')">削除</button>`
      : `<button class="mini-btn gray" onclick="leaveGroup('${gid}')">退出</button>`;
    return `<div class="friend-item"><span class="fname">👥 ${esc(g.name)}</span>` +
      `<button class="mini-btn gray" onclick="showInvite('${gid}')">招待</button>` + subBtn +
      `<button class="mini-btn" onclick="talkGroup('${escJs(g.room)}')">トーク</button></div>`;
  }).join('');
}
window.toggleGroupForm = function(){
  const f = document.getElementById('groupForm');
  if (f.style.display === 'none') {
    const ids = Object.keys(myFriends);
    document.getElementById('groupFriendPick').innerHTML = ids.length ? ids.map(uid =>
      `<label class="friend-item"><input type="checkbox" class="gcheck" data-uid="${uid}"> ${esc(myFriends[uid].name)}</label>`
    ).join('') : '<div class="empty">フレンドがいません(先にフレンドを追加してね)</div>';
    f.style.display = 'block';
  } else { f.style.display = 'none'; }
};
window.createGroup = async function(){
  const name = document.getElementById('groupName').value.trim();
  if (!name) { alert('グループ名を入力してね'); return; }
  const me = auth.currentUser;
  const gid = 'g' + Date.now();
  const room = 'room_' + gid;
  const members = { [me.uid]: me.displayName || 'ななし' };
  const picked = [...document.querySelectorAll('.gcheck:checked')].map(cb => cb.dataset.uid);
  for (const uid of picked) members[uid] = myFriends[uid].name;
  await set(ref(db,'groups/'+gid), { name, room, members, owner: me.uid });
  for (const uid of Object.keys(members)) {
    await set(ref(db,'userGroups/'+uid+'/'+gid), { name, room });
  }
  document.getElementById('groupName').value = '';
  document.getElementById('groupForm').style.display = 'none';
  alert('グループ「' + name + '」を作りました!');
};
window.showInvite = function(gid){
  currentInviteGid = gid;
  const g = myGroups[gid];
  const notIn = Object.keys(myFriends).filter(uid => !g.members || !g.members[uid]);
  document.getElementById('inviteBox').innerHTML = notIn.length ? notIn.map(uid =>
    `<label class="friend-item"><input type="checkbox" class="icheck" data-uid="${uid}"> ${esc(myFriends[uid].name)}</label>`
  ).join('') + '<div style="margin-top:4px"><button class="mini-btn green" onclick="doInvite()">招待する</button></div>'
  : '<div class="empty">招待できるフレンドがいません</div>';
};
window.doInvite = async function(){
  const gid = currentInviteGid, g = myGroups[gid];
  const picked = [...document.querySelectorAll('.icheck:checked')].map(cb => cb.dataset.uid);
  for (const uid of picked) {
    await set(ref(db,'userGroups/'+uid+'/'+gid), { name: g.name, room: g.room });
    await set(ref(db,'groups/'+gid+'/members/'+uid), myFriends[uid].name);
  }
  document.getElementById('inviteBox').innerHTML = '';
  alert('招待しました!');
};
window.deleteGroup = async function(gid){
  const g = myGroups[gid];
  if (!confirm('グループ「' + g.name + '」を削除しますか?\n全員のグループ一覧から消えます。')) return;
  const snap = await get(ref(db,'groups/'+gid+'/members'));
  const members = snap.val() || {};
  for (const uid of Object.keys(members)) {
    await remove(ref(db,'userGroups/'+uid+'/'+gid));
  }
  await remove(ref(db,'groups/'+gid));
};
window.leaveGroup = async function(gid){
  const g = myGroups[gid];
  if (!confirm('グループ「' + g.name + '」から退出しますか?')) return;
  await remove(ref(db,'userGroups/'+currentUid+'/'+gid));
  await remove(ref(db,'groups/'+gid+'/members/'+currentUid));
};
window.talkGroup = function(room){
  document.getElementById('roomCode').value = room;
  join();
};

/* ===== チャット ===== */
window.join = async function(){
  userName = document.getElementById('userName').value.trim();
  roomId   = document.getElementById('roomCode').value.trim();
  if (!userName || !roomId) { alert('名前とルーム名を入力してね'); return; }
  document.getElementById('joinScreen').classList.remove('active');
  document.getElementById('chatScreen').classList.add('active');
  document.getElementById('roomLabel').textContent = '📍 ' + roomId;

  const base = 'rooms/' + roomId;
  try {
    // ★全員抜けてたら履歴をリセット
    const presenceSnap = await get(ref(db, base + '/presence'));
    if (!presenceSnap.exists()) {
      await set(ref(db, base + '/messages'), null);
    }
    // 自分の在室マーク(接続が切れたら自動で消える)
    const myRef = push(ref(db, base + '/presence'));
    await set(myRef, true);
    onDisconnect(myRef).remove();
  } catch (e) {
    document.getElementById('connLabel').textContent = '⚠ 接続エラー(Realtime Databaseのルールを確認してね)';
    document.getElementById('connLabel').style.color = '#ff3b30';
    return;
  }

  const roomRef = ref(db, base + '/messages');
  onValue(roomRef, snap => {
    const val = snap.val();
    document.getElementById('connLabel').textContent = '● 接続中';
    document.getElementById('connLabel').style.color = '#30d158';
    if (!val) return;
    const box = document.getElementById('messages');
    Object.entries(val).forEach(([k, m]) => {
      if (k <= lastKey) return;
      lastKey = k;
      if (!m.name) return; // システム用メッセージは表示しない
      const row = document.createElement('div');
      row.className = 'msg-row ' + (m.name === userName ? 'me' : 'them');
      const time = m.ts ? fmt(m.ts) : '';
      if (m.name !== userName) {
        row.innerHTML = `<div class="sender" style="color:${colorOf(m.name)}">● ${esc(m.name)}</div>` +
          `<div class="bubble">${esc(m.text)}</div><div class="msg-time">${time}</div>`;
      } else {
        row.innerHTML = `<div class="msg-time">${time}</div><div class="bubble">${esc(m.text)}</div>`;
      }
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    });
  });
  push(roomRef, { name: '', text: '__join__', ts: serverTimestamp() }); // 接続テスト
  document.getElementById('msgInput').focus();
};

window.send = function(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  push(ref(db, 'rooms/' + roomId + '/messages'), { name: userName, text, ts: serverTimestamp() });
};
</script>
</body>
</html>
